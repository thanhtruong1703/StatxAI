<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatxAI - Thống kê trong TDTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f3f6f4;--ink:#11221c;--muted:#5b6b63;--line:#cfd9d3;--card:#fff;--acc:#0b6e4f;--acc-ink:#fff;--err:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{padding:40px 20px 24px;max-width:1000px;margin:auto}
  h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
  header p{margin:8px 0 0;color:var(--muted);max-width:60ch}
  main{max-width:1000px;margin:auto;padding:0 20px 60px;display:grid;gap:20px;grid-template-columns:340px 1fr}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
  h2{margin:0 0 14px;font-size:18px}
  label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
  input,select,button{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  button{margin-top:18px;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #msg{margin-top:12px;font-size:14px;min-height:20px}
  #msg.ok{color:var(--acc)} #msg.err{color:var(--err)}
  .right{display:grid;gap:20px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .bar h2{margin:0} .bar select{width:auto;min-width:160px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:var(--muted)}
  .chart{position:relative;height:260px;margin-top:16px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:500}
  .hint{font-size:13px;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>StatxAI</h1>
  <p>Nhập số liệu thể thao của bạn (thời gian chạy, bật xa, nhịp tim...). Dữ liệu của cả lớp được gom lại và thống kê ngay bên cạnh.</p>
</header>

<main>
  <section>
    <h2>Nhập số liệu</h2>
    <form id="f" autocomplete="off">
      <label for="name">Họ và tên</label>
      <input id="name" required maxlength="60">
      <label for="mssv">MSSV</label>
      <input id="mssv" required maxlength="20">
      <label for="item">Nội dung đo</label>
      <input id="item" list="items" required maxlength="40" placeholder="Ví dụ: Chạy 100m (giây)">
      <datalist id="items"></datalist>
      <label for="value">Giá trị (số)</label>
      <input id="value" type="number" step="any" required placeholder="Ví dụ: 13.5">
      <button id="btn" type="submit">Gửi số liệu</button>
      <div id="msg" role="status"></div>
    </form>
    <p class="hint">Cùng một nội dung đo thì hãy gõ giống nhau (cùng đơn vị) để thống kê gộp đúng.</p>
  </section>

  <div class="right">
    <section>
      <div class="bar">
        <h2>Thống kê</h2>
        <select id="filter" aria-label="Chọn nội dung đo"></select>
      </div>
      <div class="stats" id="stats"></div>
      <div class="chart"><canvas id="chart"></canvas></div>
    </section>
    <section>
      <h2>Dữ liệu mới nhất</h2>
      <div class="tw">
        <table>
          <thead><tr><th>Thời gian</th><th>Họ tên</th><th>MSSV</th><th>Nội dung</th><th>Giá trị</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
// DÁN URL Apps Script (đã Deploy) vào giữa hai dấu nháy:
const API = 'https://script.google.com/macros/s/AKfycbwwvtndu1UOjgnw41k7UT4F6D4FEBbwm1pZ5kNFcTbyIgXWzgYSi0TvaUQM2hzwtRUu/exec';

let data = [];      // mỗi phần tử: {time, name, mssv, item, value}
let chart = null;
const $ = id => document.getElementById(id);

async function load() {
  try {
    const res = await fetch(API);
    const rows = (await res.json()).slice(1);
    data = rows.map(r => ({ time: r[0], name: r[1], mssv: r[2], item: String(r[3]), value: Number(r[4]) }))
               .filter(d => d.item && !isNaN(d.value));
    render();
  } catch (e) {
    $('stats').textContent = 'Chưa tải được dữ liệu. Kiểm tra lại URL Apps Script.';
  }
}

function median(a) {
  const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function sd(a, mean) {
  if (a.length < 2) return 0;
  return Math.sqrt(a.reduce((t, x) => t + (x - mean) ** 2, 0) / (a.length - 1));
}
const f = n => Number.isFinite(n) ? Math.round(n * 100) / 100 : '-';

function render() {
  // danh sách nội dung đo
  const items = [...new Set(data.map(d => d.item))];
  const sel = $('filter'), cur = sel.value;
  sel.innerHTML = '';
  items.forEach(i => sel.add(new Option(i, i)));
  if (items.includes(cur)) sel.value = cur;
  $('items').innerHTML = '';
  items.forEach(i => { const o = document.createElement('option'); o.value = i; $('items').appendChild(o); });

  const subset = data.filter(d => d.item === sel.value);
  const v = subset.map(d => d.value);
  const box = $('stats');
  box.innerHTML = '';
  if (!v.length) { box.textContent = 'Chưa có dữ liệu. Hãy là người đầu tiên nhập số liệu.'; }
  else {
    const mean = v.reduce((a, b) => a + b, 0) / v.length;
    [['Số mẫu', v.length], ['Trung bình', f(mean)], ['Trung vị', f(median(v))],
     ['Độ lệch chuẩn', f(sd(v, mean))], ['Nhỏ nhất', f(Math.min(...v))], ['Lớn nhất', f(Math.max(...v))]]
    .forEach(([k, val]) => {
      const d = document.createElement('div'); d.className = 'stat';
      d.innerHTML = '<b></b><span></span>';
      d.children[0].textContent = val; d.children[1].textContent = k;
      box.appendChild(d);
    });
  }
  drawChart(v);

  // bảng 10 dòng mới nhất
  const tb = $('rows'); tb.innerHTML = '';
  [...data].reverse().slice(0, 10).forEach(d => {
    const tr = tb.insertRow();
    const t = new Date(d.time);
    [isNaN(t) ? '' : t.toLocaleString('vi-VN'), d.name, d.mssv, d.item, d.value]
      .forEach(x => { tr.insertCell().textContent = x; });
  });
}

function drawChart(v) {
  if (chart) chart.destroy();
  if (!v.length) return;
  const min = Math.min(...v), max = Math.max(...v);
  const k = Math.min(8, Math.max(3, Math.ceil(Math.sqrt(v.length))));
  const w = (max - min) / k || 1;
  const counts = Array(k).fill(0);
  v.forEach(x => { counts[Math.min(k - 1, Math.floor((x - min) / w))]++; });
  const labels = counts.map((_, i) => f(min + i * w) + ' - ' + f(min + (i + 1) * w));
  chart = new Chart($('chart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Số người', data: counts, backgroundColor: '#0b6e4f' }] },
    options: { maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, title: { display: true, text: 'Phân bố giá trị' } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

$('filter').addEventListener('change', render);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('msg'), btn = $('btn');
  if (API.startsWith('DÁN')) { msg.className = 'err'; msg.textContent = 'Chưa dán URL Apps Script vào biến API trong index.html.'; return; }
  const body = {
    name: $('name').value.trim(), mssv: $('mssv').value.trim(),
    item: $('item').value.trim(), value: $('value').value
  };
  if (!body.name || !body.mssv || !body.item || isNaN(Number(body.value))) {
    msg.className = 'err'; msg.textContent = 'Vui lòng điền đủ thông tin, giá trị phải là số.'; return;
  }
  btn.disabled = true; btn.textContent = 'Đang gửi...'; msg.className = ''; msg.textContent = '';
  try {
    // Không đặt Content-Type JSON để tránh lỗi CORS preflight với Apps Script
    await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    msg.className = 'ok'; msg.textContent = 'Đã gửi số liệu.';
    $('value').value = '';
    setTimeout(load, 1000);
  } catch (err) {
    msg.className = 'err'; msg.textContent = 'Gửi thất bại. Kiểm tra mạng hoặc URL Apps Script.';
  }
  btn.disabled = false; btn.textContent = 'Gửi số liệu';
});

if (!API.startsWith('DÁN')) { load(); setInterval(load, 8000); }
else { $('stats').textContent = 'Hãy dán URL Apps Script vào biến API để xem thống kê.'; }
</script>
</body>
</html>
